name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend-test:
    name: Frontend Tests & Security
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3999/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:3999/media
      NEXT_PUBLIC_CHECKOUT_MODE: manual

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint code
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build standalone production server
        working-directory: frontend
        run: npm run build

      - name: Verify standalone output
        working-directory: frontend
        run: test -f .next/standalone/server.js

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  backend-test:
    name: Backend Tests & Security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_12345
          POSTGRES_DB: sanad_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:test_password_12345@localhost:5432/sanad_test_db
      JWT_ACCESS_SECRET: test-access-secret-that-is-at-least-32-chars-long
      JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-chars-different
      PAYMENT_WEBHOOK_SECRET: test-webhook-secret-at-least-32-characters-long-unique
      PAYMENT_PROVIDER: bypass
      FRONTEND_URL: http://localhost:3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Lint code
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        working-directory: backend
        run: npm run test:cov

      - name: Run e2e tests
        working-directory: backend
        run: npm run test:e2e

      # Verifies the migrated schema itself: applied migrations, security
      # columns, unique token indexes, and the shared rate-limit table.
      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Security audit
        working-directory: backend
        run: npm audit --audit-level=high

      # Runs the application's environment contract against production rules,
      # so a broken deployment fails in CI before the container starts.
      - name: Preflight production environment validation
        working-directory: backend
        env:
          NODE_ENV: production
          FRONTEND_URL: https://example.test
          CORS_ORIGINS: https://example.test
          TRUST_PROXY: "1"
          SWAGGER_ENABLED: "false"
          SMTP_HOST: smtp.example.test
          REQUIRE_EMAIL_VERIFICATION: "true"
          PAYMENT_PROVIDER: manual
        run: npm run preflight:production

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend
          fail_ci_if_error: false
